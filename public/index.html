<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ticketing</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="card">
    <img class="logo" src="/logo.png" alt="Sous Le Baobab — Cameroonian & European Brunch" />

    <div class="brand-tag">FOOD · CULTURE · PEOPLE · GOOD VIBES</div>
    <p class="description" id="event-description-title">[EVENT DESCRIPTION]</p>
    <button type="button" class="info-toggle" id="description-toggle" aria-expanded="false" aria-controls="description-popover" style="display:none;">
      <span class="info-icon">i</span> Click me to know more
    </button>
    <div class="description-popover" id="description-popover" hidden>
      <p id="event-description-body"></p>
    </div>
    <div class="divider"></div>

    <div class="features">
      <div class="feature">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3v7a3 3 0 0 0 6 0V3M7 10v11M17 3c-2 2-2 5-2 7a2 2 0 0 0 4 0c0-2 0-5-2-7ZM17 13v8" /></svg>
        <span>AUTHENTIC<br />FLAVORS</span>
      </div>
      <div class="feature">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0ZM21 16a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" /></svg>
        <span>GOOD<br />MUSIC</span>
      </div>
      <div class="feature">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-8-4.9-8-11.2A4.8 4.8 0 0 1 12 6a4.8 4.8 0 0 1 8 3.8C20 16.1 12 21 12 21Z" /></svg>
        <span>AMAZING<br />PEOPLE</span>
      </div>
    </div>

    <div class="meta-row">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><rect x="3" y="5" width="18" height="16" rx="2" /><path d="M3 10h18M8 3v4M16 3v4" /></svg>
      <span id="event-date">[DATE]</span>
    </div>
    <div class="meta-row">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21Z" /><circle cx="12" cy="9.5" r="2.5" /></svg>
      <span id="event-location">[LOCATION]</span>
    </div>

    <div class="price-box">
      <div class="amount" id="event-price">—</div>
      <div class="unit">PER PERSON</div>
      <div class="includes" id="event-includes" style="display:none;"></div>
    </div>

    <div class="buyer-form">
      <input type="text" id="buyer-name" placeholder="Your first name" autocomplete="given-name" />
      <input type="email" id="buyer-email" placeholder="Your email address" autocomplete="email" required />
    </div>
    <button id="buy-button">Pay using PayPal</button>
    <div class="error" id="error-message"></div>
    <p class="note">You'll be redirected to PayPal to pay. Your ticket (QR code) will be emailed to you once the payment is confirmed.</p>

    <div class="footer-tag">FOOD • CULTURE • CONNECTION</div>
  </div>

  <script>
    async function loadEvent() {
      try {
        const res = await fetch("/api/event");
        const data = await res.json();

        const rawDescription = data.description || "[EVENT DESCRIPTION]";
        const [title, ...restParts] = rawDescription.split("\n\n");
        const rest = restParts.join("\n\n");

        document.getElementById("event-description-title").innerHTML = title;

        if (rest) {
          document.getElementById("event-description-body").innerHTML = rest;
          document.getElementById("description-toggle").style.display = "";
        }

        document.getElementById("event-date").textContent = data.date || "[DATE]";
        document.getElementById("event-location").textContent = data.location || "[LOCATION]";

        if (data.priceCents != null) {
          const amount = (data.priceCents / 100).toFixed(2);
          document.getElementById("event-price").textContent =
            `${amount} ${data.currency.toUpperCase()}`;
        } else {
          document.getElementById("event-price").textContent = "";
        }

        if (data.includes) {
          const includesEl = document.getElementById("event-includes");
          includesEl.textContent = data.includes;
          includesEl.style.display = "block";
        }
      } catch (err) {
        console.error("Unable to load event info", err);
      }
    }

    async function buyTicket() {
      const button = document.getElementById("buy-button");
      const errorEl = document.getElementById("error-message");
      const name = document.getElementById("buyer-name").value.trim();
      const email = document.getElementById("buyer-email").value.trim();
      errorEl.textContent = "";

      if (!email) {
        errorEl.textContent = "Please enter your email address";
        return;
      }

      button.disabled = true;
      button.textContent = "Redirecting to PayPal…";

      try {
        const res = await fetch("/api/create-reservation", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, email }),
        });
        const data = await res.json();

        if (!res.ok || !data.paypalUrl) {
          throw new Error(data.error || "Unknown error");
        }

        window.location.href = data.paypalUrl;
      } catch (err) {
        errorEl.textContent = "Unable to start the payment. Please try again later.";
        button.disabled = false;
        button.textContent = "Pay using PayPal";
      }
    }

    document.getElementById("description-toggle").addEventListener("click", () => {
      const popover = document.getElementById("description-popover");
      const toggle = document.getElementById("description-toggle");
      const isHidden = popover.hasAttribute("hidden");

      if (isHidden) {
        popover.removeAttribute("hidden");
        toggle.setAttribute("aria-expanded", "true");
      } else {
        popover.setAttribute("hidden", "");
        toggle.setAttribute("aria-expanded", "false");
      }
    });

    document.getElementById("buy-button").addEventListener("click", buyTicket);
    loadEvent();
  </script>
</body>
</html>
