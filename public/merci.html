<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paiement confirmé</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111827;
      color: #f9fafb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 420px;
      background: #1f2937;
      border-radius: 16px;
      padding: 32px;
    }
    h1 { margin: 0 0 12px; }
    p { color: #d1d5db; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Merci pour ton achat 🎟️</h1>
    <p>
      Ton paiement a bien été reçu. Ton billet avec son QR code vient de
      t'être envoyé par email.
    </p>
    <p>Si tu ne le vois pas d'ici quelques minutes, pense à vérifier tes spams.</p>
  </div>
</body>
</html>
